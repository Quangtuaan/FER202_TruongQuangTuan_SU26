<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | ATELIER</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;700;800&amp;family=Manrope:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        
        .glass-card {
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid transparent;
            background-clip: padding-box;
            position: relative;
        }

        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(to bottom right, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .gold-glow:hover {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .input-focus-line {
            transition: width 0.3s ease;
            width: 0;
        }

        input:focus + .input-focus-line {
            width: 100%;
        }

        @keyframes subtle-pan {
            from { transform: scale(1.05) translateX(0); }
            to { transform: scale(1.1) translateX(-2%); }
        }

        .animate-pan {
            animation: subtle-pan 20s infinite alternate ease-in-out;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#141313",
                        "surface-container-low": "#1c1b1b",
                        "error": "#ffb4ab",
                        "surface-container-high": "#2b2a2a",
                        "on-background": "#e5e2e1",
                        "tertiary-container": "#040505",
                        "surface-variant": "#353434",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#c6c6c6",
                        "outline": "#8e9192",
                        "secondary-fixed-dim": "#c8c6c5",
                        "secondary-container": "#4a4949",
                        "on-surface-variant": "#c4c7c7",
                        "on-secondary-container": "#bab8b7",
                        "surface": "#141313",
                        "outline-variant": "#444748",
                        "on-tertiary-fixed-variant": "#464747",
                        "on-primary": "#313030",
                        "on-tertiary": "#2f3131",
                        "inverse-surface": "#e5e2e1",
                        "surface-container-highest": "#353434",
                        "surface-container": "#201f1f",
                        "primary-fixed": "#e5e2e1",
                        "error-container": "#93000a",
                        "surface-container-lowest": "#0e0e0e",
                        "tertiary-fixed": "#e3e2e2",
                        "inverse-on-surface": "#313030",
                        "on-secondary-fixed-variant": "#474646",
                        "on-secondary-fixed": "#1c1b1b",
                        "background": "#141313",
                        "surface-bright": "#3a3939",
                        "on-surface": "#e5e2e1",
                        "on-tertiary-fixed": "#1a1c1c",
                        "primary-container": "#050505",
                        "secondary": "#c8c6c5",
                        "secondary-fixed": "#e5e2e1",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "primary-fixed-dim": "#c9c6c5",
                        "primary": "#c9c6c5",
                        "on-primary-container": "#797777",
                        "surface-tint": "#c9c6c5",
                        "on-secondary": "#313030",
                        "on-primary-fixed": "#1c1b1b",
                        "inverse-primary": "#5f5e5e",
                        "on-error": "#690005",
                        "on-tertiary-container": "#767777",
                        "on-primary-fixed-variant": "#474646",
                        "gold": "#D4AF37",
                        "silver": "#C0C0C0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "unit": "8px",
                        "margin-mobile": "20px",
                        "container-max": "1440px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Anybody"],
                        "body-lg": ["Manrope"],
                        "headline-lg-mobile": ["Anybody"],
                        "body-md": ["Manrope"],
                        "label-md": ["Space Grotesk"],
                        "display-lg": ["Anybody"]
                    },
                    "fontSize": {
                        "headline-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "0.03em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "400"}],
                        "headline-lg-mobile": ["32px", {"lineHeight": "38px", "letterSpacing": "0.03em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "400"}],

                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-surface selection:bg-gold selection:text-black overflow-hidden h-screen">
<main class="flex h-full w-full">
<!-- Left Side: Cinematic Visuals -->
<section class="hidden lg:block lg:w-3/5 h-full relative overflow-hidden bg-surface-container-lowest">
<div class="absolute inset-0 z-10 bg-gradient-to-r from-transparent via-transparent to-background"></div>
<div class="absolute inset-0 z-10 bg-black/40"></div>
<!-- Supercar Headlight Image -->
<div class="w-full h-full animate-pan bg-cover bg-center" data-alt="An extreme cinematic close-up of a high-end supercar's LED headlight assembly in a dark obsidian showroom at midnight. The lighting is low-key, highlighting the intricate technical details of the carbon fiber housing and the sharp geometric glint of the glass lens. The overall atmosphere is luxury and raw power, using a palette of deep blacks and subtle silver reflections to evoke technical precision and exclusivity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC6ucIPgiBCuzVp_2FkwpkhAVuLmwrwM4wXHlDRWk5zr_NZgPqoM4YkjvVjSX9Kwf3U0NkUEVn219FsuzkzDXiU8K61DAXv3zwmrhmOjXZgQtqyaZP1TKkeRQP1QZdP2WioRkSXTfJJeGGcyIH8Dk8aOq-L6Icbu9B4PU7RvUSCRJazkE-ant9ISS_ABmPPJgLXDvI1a8PmXUtBNQek7aVtCY_gUTduK2uDv2ErklNO3M_lhFDzuIO1zpaEqaRuTr0QGl8GnYZzqns')">
</div>
<!-- Brand Overlay -->
<div class="absolute top-12 left-12 z-20">
<span class="font-display-lg text-headline-lg tracking-tighter text-on-surface">ATELIER</span>
<p class="font-label-md text-label-md text-secondary mt-2 tracking-[0.2em] uppercase opacity-60">Automotive Excellence</p>
</div>
<!-- Spec Grid Minimalist -->
<div class="absolute bottom-12 left-12 z-20 flex gap-12">
<div>
<span class="block font-label-md text-[10px] text-secondary/50 uppercase tracking-widest mb-1">Status</span>
<span class="font-label-md text-label-md text-on-surface uppercase">Awaiting Authorization</span>
</div>
<div class="w-px h-10 bg-white/10"></div>
<div>
<span class="block font-label-md text-[10px] text-secondary/50 uppercase tracking-widest mb-1">Secure Node</span>
<span class="font-label-md text-label-md text-on-surface uppercase tracking-widest">TLS 1.3 / E2E</span>
</div>
</div>
</section>
<!-- Right Side: Login Form -->
<section class="w-full lg:w-2/5 h-full flex items-center justify-center bg-background px-margin-mobile md:px-margin-desktop relative">
<!-- Mobile Brand Logo -->
<div class="absolute top-8 left-margin-mobile lg:hidden">
<span class="font-display-lg text-headline-lg-mobile tracking-tighter text-on-surface">ATELIER</span>
</div>
<!-- Login Card -->
<div class="glass-card w-full max-w-md p-8 md:p-12 rounded-xl flex flex-col gap-8 transition-all duration-500 hover:border-white/10">
<div class="flex flex-col gap-2">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Welcome Back</h1>
<p class="font-body-md text-body-md text-secondary">Access your private collection.</p>
</div>
<form class="flex flex-col gap-6" onsubmit="return false;">
<!-- Email Field -->
<div class="flex flex-col gap-2 group">
<label class="font-label-md text-label-md text-secondary/70 uppercase tracking-widest" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-black/40 border-none border-b border-white/10 px-0 py-3 text-on-surface font-body-md focus:ring-0 focus:outline-none placeholder:text-secondary/20" id="email" name="email" placeholder="name@atelier.com" required="" type="email"/>
<div class="absolute bottom-0 left-0 h-[1px] bg-gold input-focus-line"></div>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2 group">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-secondary/70 uppercase tracking-widest" for="password">Password</label>
<a class="font-label-md text-[12px] text-gold/80 hover:text-gold transition-colors uppercase tracking-wider" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full bg-black/40 border-none border-b border-white/10 px-0 py-3 text-on-surface font-body-md focus:ring-0 focus:outline-none placeholder:text-secondary/20" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute bottom-0 left-0 h-[1px] bg-gold input-focus-line"></div>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-3 group cursor-pointer" onclick="document.getElementById('remember').click()">
<div class="relative flex items-center">
<input class="peer h-5 w-5 bg-surface-container-high border-white/10 rounded-sm text-gold focus:ring-0 focus:ring-offset-0" id="remember" type="checkbox"/>
</div>
<span class="font-label-md text-label-md text-secondary group-hover:text-on-surface transition-colors">Remember this device</span>
</div>
<!-- Primary Action -->
<button class="mt-4 w-full bg-gold text-black font-label-md text-label-md uppercase tracking-[0.2em] py-4 rounded-sm gold-glow transition-all active:scale-95 flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Secondary Action -->
<div class="flex flex-col items-center gap-4 border-t border-white/5 pt-8">
<p class="font-body-md text-label-md text-secondary/60">New to the Atelier?</p>
<button class="w-full border border-white/10 bg-transparent text-on-surface font-label-md text-label-md uppercase tracking-widest py-4 rounded-sm hover:bg-white/5 transition-all active:scale-95">
                        Create an Account
                    </button>
</div>
</div>
<!-- Technical Detail Footer -->
<div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-full px-margin-desktop flex justify-between items-center lg:px-0 lg:w-[448px] opacity-30">
<span class="font-label-md text-[10px] uppercase tracking-widest">© 2024 ATELIER</span>
<div class="flex gap-4">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="material-symbols-outlined text-[16px]">language</span>
</div>
</div>
</section>
</main>
<!-- Micro-interaction Scripts -->
<script>
        // Interactive focus animations and hover glints
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.glass-card').style.borderColor = 'rgba(212, 175, 55, 0.1)';
            });
            input.addEventListener('blur', () => {
                input.closest('.glass-card').style.borderColor = 'transparent';
            });
        });

        // Atmospheric shimmer effect on movement
        const card = document.querySelector('.glass-card');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 100;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 100;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body></html>
